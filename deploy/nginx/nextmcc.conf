# Sample gateway for the strangler-fig migration (docs/09-modernization-plan.md section 2.2).
# One hostname for everything, so the legacy OWIN cookie and the SPA share the origin (the cookie bridge needs that).
# This is a SAMPLE: replace hosts, ports, server_name and TLS with the real values before use.
# Flipping a page = add a location block (or a map entry) below and reload nginx.

# ---- Upstreams ---------------------------------------------------------------------------------------------------
upstream legacy_iis {
    server iis-host.internal:80;          # Windows IIS host running the legacy CIMS_NextMCC
}

upstream nextmcc_api {
    server 127.0.0.1:5021;                # cims-nextmcc-api container (INTERNAL_PROXY_PORT: dev 5021, uat 5022, prod 5023)
}

upstream nextmcc_spa {
    server 127.0.0.1:5031;                # static SPA container (Vite build served by nginx, with an index.html fallback)
}

# upstream cims_identity {                # CIMS Identity Server, once it is routed through this gateway
#     server 127.0.0.1:7001;
# }

# ---- Pilot routing -----------------------------------------------------------------------------------------------
# A user with the cookie  cims_pilot=1  gets the NEW page for flipped paths; everyone else stays on the legacy page.
map $cookie_cims_pilot $is_pilot {
    default 0;
    "1"     1;
    "true"  1;
}

# Pick the upstream for a flipped page: pilot users -> SPA, others -> legacy.
# (A variable in proxy_pass that names an upstream group above is resolved without a DNS resolver.)
map $is_pilot $flipped_upstream {
    0 legacy_iis;
    1 nextmcc_spa;
}

server {
    listen 80;
    server_name cims.example.internal;    # TODO: real host name; terminate TLS here (listen 443 ssl; ...)

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ---- New API: always the new backend ---------------------------------------------------------------------------
    # /api/v1/ only. The legacy Web API lives under /api/<Controller>/<action> (e.g. /api/DataApi/...) and stays on IIS.
    # The X-Tenant header is passed through unchanged; the API validates it against the token's "tenants" claim.
    location /api/v1/ {
        proxy_pass http://nextmcc_api;
    }

    # Health endpoints of the API, for monitoring.
    location = /nextmcc-api/health {
        proxy_pass http://nextmcc_api/health;
    }

    # ---- SPA static assets (Vite built with base '/app/') -----------------------------------------------------------
    location /app/ {
        proxy_pass http://nextmcc_spa;
    }

    # ---- Flipped pages (examples) ------------------------------------------------------------------------------------
    # The first route flipped is the login page (docs/09 section 4.3); pilot users see the SPA login, others the legacy one.
    location = /Account/Login {
        proxy_pass http://$flipped_upstream;
    }

    # A page flipped for pilot users only. When the pilot is over, replace $flipped_upstream with nextmcc_spa
    # (everyone) and finally delete the block once the legacy page is retired.
    location = /Data/ConfirmArrival {
        proxy_pass http://$flipped_upstream;
    }

    # ---- Everything not yet flipped -> legacy IIS --------------------------------------------------------------------
    location / {
        proxy_pass http://legacy_iis;
    }
}

# Sample gateway for the strangler-fig migration (docs/09-modernization-plan.md section 2.2).
# One hostname for everything, so the legacy OWIN cookie and the SPA share the origin (the cookie bridge needs that).
# The SPA is served at the SITE ROOT (no sub-path) and its routes mirror the legacy page paths.
# This is a SAMPLE: replace hosts, ports, server_name and TLS with real values. See README.md for the flip procedure.

# ---- Upstreams ---------------------------------------------------------------------------------------------------
upstream legacy_iis {
    server iis-host.internal:80;          # Windows IIS host running the legacy CIMS_NextMCC
}

upstream nextmcc_api {
    server 127.0.0.1:5021;                # cims-nextmcc-api container (INTERNAL_PROXY_PORT: dev 5021, uat 5022, prod 5023)
}

upstream nextmcc_spa {
    server 127.0.0.1:5031;                # SPA container: static files with an index.html fallback (see "Deep links" below)
}

upstream cims_identity {                  # CIMS Identity Server (placeholder: set the real host and port)
    server 127.0.0.1:7001;
}

# ---- Pilot routing -----------------------------------------------------------------------------------------------
# A user carrying the cookie  cims_pilot=1  gets the NEW page on pilot-flipped paths; everyone else stays on legacy.
map $cookie_cims_pilot $is_pilot {
    default 0;
    "1"     1;
    "true"  1;
}

# Upstream for a pilot-flipped page: pilot users -> SPA, others -> legacy.
# (A variable in proxy_pass that names an upstream group defined above is resolved without a DNS resolver.)
map $is_pilot $pilot_upstream {
    0 legacy_iis;
    1 nextmcc_spa;
}

server {
    listen 80;
    server_name cims.example.internal;    # TODO: real host name; terminate TLS here (listen 443 ssl; ...)

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ---- API: always the new backend ---------------------------------------------------------------------------------
    # Only the versioned prefix goes to the new API. The legacy Web API lives under /api/<Controller>/<action>
    # (e.g. /api/DataApi/getfldParas) and is still used by every unflipped legacy page, so a blanket "/api/" to the
    # new API would break them. Widen this to "location /api/" only after the last legacy /api/ caller is gone.
    # The X-Tenant header is passed through; the API validates it against the token's "tenants" claim.
    location /api/v1/ {
        proxy_pass http://nextmcc_api;
    }

    location = /nextmcc-api/health {      # monitoring
        proxy_pass http://nextmcc_api/health;
    }

    # ---- Identity Server ---------------------------------------------------------------------------------------------
    location /identity/ {
        proxy_pass http://cims_identity/;   # placeholder: adjust the path mapping to how Identity is hosted
    }

    # ---- SPA static assets (Vite build output, content-hashed file names) -----------------------------------------
    location /assets/ {
        proxy_pass http://nextmcc_spa;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Routing table: ONE block per flipped page path --------------------------------------------------------------
    # Deep links: a flipped path reaches the SPA with its original URI, so the SPA container MUST answer any such
    # path with index.html (try_files $uri /index.html), otherwise a reload or bookmark of a flipped page gives a 404.
    # SPA-only routes that have no legacy twin (for example the OIDC redirect URI) need their own block here.

    # Flipped for EVERYONE. /Account/Login is the first route flipped (docs/09 section 4.3).
    location = /Account/Login {
        proxy_pass http://nextmcc_spa;
    }

    # Flipped for PILOT users only (cookie cims_pilot=1); everyone else still gets the legacy page.
    # When the pilot ends: change to  proxy_pass http://nextmcc_spa;  Roll back: change to  proxy_pass http://legacy_iis;
    location = /Data/ConfirmArrival {
        proxy_pass http://$pilot_upstream;
    }

    # Example of an SPA-only route (uncomment and adjust to the redirect URI registered in Identity):
    # location = /signin-callback {
    #     proxy_pass http://nextmcc_spa;
    # }

    # ---- Legacy: sounds and everything not yet flipped ---------------------------------------------------------------
    location /Sounds/ {
        proxy_pass http://legacy_iis;
    }

    location / {
        proxy_pass http://legacy_iis;
    }
}

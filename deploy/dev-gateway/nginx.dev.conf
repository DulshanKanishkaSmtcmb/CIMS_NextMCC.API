# Local strangler-fig gateway for a developer laptop (docs: legacy workspace docs/14-dev-gateway.md).
# Derived from deploy/nginx/nextmcc.conf: the routing table, the pilot map and the proxy headers are the same; what
# differs is listed in README.md next to this file. Start it with start-dev-gateway.ps1, never by hand: the script
# creates the prefix folder (-p C:\devgw\nginx\) that the relative paths below resolve against.
#
#   http://localhost:8080  (gateway, this file)
#     /api/v1/                      -> nextmcc_api  http://localhost:5212   (CIMSNextMCC.API, Development)
#     /assets/, SPA-only routes,    -> nextmcc_spa  http://127.0.0.1:5031   (second server below: the FE build,
#     flipped page paths                                                     like the SPA container would serve it)
#     everything else               -> legacy_iis   http://localhost:55243  (IIS Express, legacy workspace build)

worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Inline instead of "include mime.types": the include path would be relative to this file's folder.
    types {
        text/html                 html htm;
        text/css                  css;
        text/plain                txt;
        application/javascript    js mjs;
        application/json          json map;
        image/svg+xml             svg svgz;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/x-icon              ico;
        image/webp                webp;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
    }
    default_type  application/octet-stream;

    # $upstream_addr shows which app answered (55243 legacy, 5212 API, 5031 SPA).
    log_format  gateway  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'pilot=$is_pilot upstream=$upstream_addr ${request_time}s';
    access_log  logs/access.log  gateway;

    sendfile           on;
    keepalive_timeout  65;

    # ---- Upstreams ---------------------------------------------------------------------------------------------------
    upstream legacy_iis {
        server 127.0.0.1:55243;           # IIS Express: C:\devgw\legacy\CIMS_NextMCC (MSBuild 14 Release of the workspace)
    }

    upstream nextmcc_api {
        server 127.0.0.1:5212;            # CIMSNextMCC.API (Kestrel, Development, DevJwt accepted)
    }

    upstream nextmcc_spa {
        server 127.0.0.1:5031;            # the "SPA container" server block at the end of this file
    }

    # ---- Pilot routing (identical to nextmcc.conf) -------------------------------------------------------------------
    map $cookie_cims_pilot $is_pilot {
        default 0;
        "1"     1;
        "true"  1;
    }

    # Diagnostic response header only (X-Served-By), not in nextmcc.conf.
    map $is_pilot $pilot_served_by {
        0 legacy;
        1 spa;
    }

    map $is_pilot $pilot_upstream {
        0 legacy_iis;
        1 nextmcc_spa;
    }

    # ---- Gateway -----------------------------------------------------------------------------------------------------
    server {
        # Loopback only: no Windows Firewall prompt, nothing reachable from the LAN.
        listen       127.0.0.1:8080;
        listen       [::1]:8080;
        server_name  localhost;

        client_max_body_size 50m;         # Excel uploads to the legacy app

        proxy_http_version 1.1;
        # $http_host keeps the port (localhost:8080). Katana builds its login redirect from the Host header, and
        # IIS Express accepts it because its binding is *:55243:localhost (host name only, port from the socket).
        # Production uses $host, which is the same thing on the default ports 80/443.
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_read_timeout 300s;          # Crystal reports and Excel exports on the legacy side can be slow
        # Safety net for an absolute redirect built from the upstream's own address.
        proxy_redirect http://localhost:55243/ /;
        proxy_redirect http://127.0.0.1:55243/ /;
        proxy_redirect http://localhost:5212/  /;

        # ---- API: always the new backend. Only /api/v1/: the legacy Web API (/api/DataApi/...) stays on IIS. ---------
        location /api/v1/ {
            proxy_pass http://nextmcc_api;
            add_header X-Served-By api always;
        }

        location = /nextmcc-api/health {
            proxy_pass http://nextmcc_api/health;
            add_header X-Served-By api always;
        }

        # ---- SPA static assets (Vite output, content-hashed). The SPA server sets the one-year immutable cache. ------
        location /assets/ {
            proxy_pass http://nextmcc_spa;
            add_header X-Served-By spa always;
        }

        # ---- SPA-only routes (no legacy twin) ----------------------------------------------------------------------
        location = /login {
            proxy_pass http://nextmcc_spa;
            add_header X-Served-By spa always;
        }

        location = /auth/callback {
            proxy_pass http://nextmcc_spa;
            add_header X-Served-By spa always;
        }

        location = /favicon.svg {
            proxy_pass http://nextmcc_spa;
            add_header X-Served-By spa always;
        }

        # ---- Pilot switch: a floor user opens /pilot/on once; /pilot/off goes back to the legacy pages. -------------
        # Not HttpOnly on purpose, so the devtools / document.cookie procedure in deploy/nginx/README.md still works.
        location = /pilot/on {
            add_header Set-Cookie "cims_pilot=1; Path=/; Max-Age=2592000; SameSite=Lax" always;
            add_header Cache-Control "no-store" always;
            return 302 /Home/Index;
        }

        location = /pilot/off {
            add_header Set-Cookie "cims_pilot=; Path=/; Max-Age=0; SameSite=Lax" always;
            add_header Cache-Control "no-store" always;
            return 302 /Home/Index;
        }

        # ---- Routing table: ONE block per flipped page path (same blocks as nextmcc.conf) ---------------------------
        # Flipped for EVERYONE: the SPA login replaces the legacy login form (docs/09 section 4.3). Legacy pages redirect
        # here with ?ReturnUrl=...; the SPA signs in, calls POST /api/v1/legacy-session and goes back to ReturnUrl.
        location = /Account/Login {
            proxy_pass http://nextmcc_spa;
            add_header X-Served-By spa always;
        }

        # Flipped for PILOT users only (cookie cims_pilot=1); everyone else still gets the legacy page.
        # Full flip: proxy_pass http://nextmcc_spa;   Roll back: proxy_pass http://legacy_iis;
        location = /Data/ConfirmArrival {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        # Wave 1 master-data pages (docs/15, 16, 17), pilot users only. Paths are the legacy menu URLs, case as in CloudMenu.
        location = /File/Country {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/Ports {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/DC {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/Supplier {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/PmSupplier {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/PMMaster {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/ProductCategory {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        # Wave 1 master-data D (docs/18), pilot users only. /File/PalletRackBuild is the older copy of the page CloudMenu points
        # to (/Data/PalletRackBuildArr); it has no menu row, so it only matters for a bookmarked URL.
        location = /File/RateCardEntry {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/OkToLoadReason {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /File/PalletRackBuild {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        location = /Data/PalletRackBuildArr {
            proxy_pass http://$pilot_upstream;
            add_header X-Served-By $pilot_served_by always;
        }

        # ---- Legacy: sounds and everything not yet flipped (pages, /api/<Controller>/..., Crystal, Content, Scripts) -
        location /Sounds/ {
            proxy_pass http://legacy_iis;
            add_header X-Served-By legacy always;
        }

        location / {
            proxy_pass http://legacy_iis;
            add_header X-Served-By legacy always;
        }
    }

    # ---- "SPA container": the FE build (apps/web/dist, junction C:\devgw\nginx\spa) -----------------------------------
    # Same contract as the FE repo's apps/web/nginx/default.conf: hashed assets cached for a year and a real 404 when
    # missing; any other path falls back to index.html (deep links, refresh); index.html is never cached.
    server {
        listen       127.0.0.1:5031;
        server_name  spa.internal;

        root   spa;
        index  index.html;

        gzip        on;
        gzip_types  text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
